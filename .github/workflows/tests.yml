name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, and a current release.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No install step: the checks are stdlib-only. anthropic, requests and
      # ffmpeg are imported lazily, inside the functions that need them.
      - run: python tests/test_pipeline.py

  render:
    # Cuts, crops and burns captions for real, then inspects the output — the
    # half of the pipeline the unit checks can only describe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - run: python tests/test_render_e2e.py
        env:
          SHORTS_E2E_OUT: ${{ runner.temp }}/render-check
      - name: Keep the rendered clips
        if: always()  # a failed render is exactly when you want to watch it
        uses: actions/upload-artifact@v4
        with:
          name: rendered-clips
          path: ${{ runner.temp }}/render-check/out
          if-no-files-found: warn
