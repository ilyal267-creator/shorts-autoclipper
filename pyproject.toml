[project]
name = "shorts-autoclipper"
version = "0.1.0"
description = "Cuts one long video into platform-native shorts and publishes them"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
shorts = "shorts.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shorts"]

[tool.setuptools.package-data]
shorts = ["system-prompt.md"]
